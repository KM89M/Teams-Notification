  <body class="antialiased text-slate-900 bg-slate-50">
    <div id="root"></div>
    <script>
      (function () {
        var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
        if (!rawEntry) return;
        function handleUnbuiltStaticHost() {
          if (window.__TEAMS_ANNOUNCER_MOUNTED__) return;
          var docsUrl = new URL('./docs/', window.location.href).toString();
          fetch(docsUrl, { method: 'HEAD' })
            .then(function (res) {
              if (res.ok) {
                window.location.replace(docsUrl);
              } else {
                showFallbackMessage();
              }
            })
            .catch(showFallbackMessage);
        }
        function showFallbackMessage() {
          if (window.__TEAMS_ANNOUNCER_MOUNTED__) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;direction:rtl;background:#f8fafc;color:#0f172a;">' +
            '<div style="max-width:480px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;text-align:center;">' +
            '<h1 style="font-size:18px;margin:0 0 10px;">يلزم تفعيل مجلد البناء لـ GitHub Pages</h1>' +
            '<p style="font-size:14px;color:#475569;line-height:1.7;margin:0 0 16px;">من إعدادات المستودع في GitHub افتح <b>Settings ← Pages</b> واختر <b>GitHub Actions</b> أو فرع <b>main</b> مع مجلد <b>/docs</b>.</p>' +
            '<a href="./docs/" style="display:inline-block;background:#059669;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;">فتح التطبيق (/docs)</a>' +
            '</div></div>';
        }
        rawEntry.addEventListener('error', handleUnbuiltStaticHost);
        window.setTimeout(function () {
          if (!window.__TEAMS_ANNOUNCER_MOUNTED__ && /\.github\.io$/i.test(window.location.hostname)) {
            handleUnbuiltStaticHost();
          }
        }, 1200);
      })();
    </script>
  </body>
</html>
