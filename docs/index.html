  <body class="antialiased text-slate-900 bg-slate-50">
    <div id="root"></div>
    <script>
      (function () {
        function getDocsPath() {
          var p = window.location.pathname || '/';
          if (/\/index\.html$/i.test(p)) {
            return p.replace(/\/index\.html$/i, '/docs/');
          }
          return p.endsWith('/') ? p + 'docs/' : p + '/docs/';
        }
        function showFallbackMessage(docsPath) {
          if (window.__TEAMS_ANNOUNCER_MOUNTED__) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;direction:rtl;background:#f8fafc;color:#0f172a;">' +
            '<div style="max-width:480px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;text-align:center;">' +
            '<h1 style="font-size:18px;margin:0 0 10px;">يلزم تفعيل مجلد البناء لـ GitHub Pages</h1>' +
            '<p style="font-size:14px;color:#475569;line-height:1.7;margin:0 0 16px;">من إعدادات المستودع في GitHub افتح <b>Settings ← Pages</b> واختر فرع <b>main</b> مع مجلد <b>/docs</b> أو اختر <b>GitHub Actions</b>.</p>' +
            '<a id="docs-fallback-link" href="./docs/" style="display:inline-block;background:#059669;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;">فتح التطبيق</a>' +
            '</div></div>';
          var linkEl = document.getElementById('docs-fallback-link');
          if (linkEl && typeof docsPath === 'string' && docsPath.startsWith('/')) {
            linkEl.setAttribute('href', docsPath);
          }
        }
        function handleUnbuiltStaticHost() {
          if (window.__TEAMS_ANNOUNCER_MOUNTED__) return;
          var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
          if (!rawEntry) return;
          var docsPath = getDocsPath();
          fetch(docsPath, { method: 'HEAD' })
            .then(function (res) {
              if (res.ok) {
                window.location.replace(docsPath);
              } else {
                showFallbackMessage(docsPath);
              }
            })
            .catch(function () {
              showFallbackMessage(docsPath);
            });
        }
        window.addEventListener(
          'error',
          function (e) {
            var target = e && e.target;
            if (
              target &&
              target.tagName === 'SCRIPT' &&
              target.getAttribute &&
              target.getAttribute('src') === '/src/main.tsx'
            ) {
              handleUnbuiltStaticHost();
            }
          },
          true,
        );
        window.setTimeout(function () {
          var host = window.location.hostname || '';
          if (
            !window.__TEAMS_ANNOUNCER_MOUNTED__ &&
            document.querySelector('script[src="/src/main.tsx"]') &&
            host !== 'localhost' &&
            host !== '127.0.0.1' &&
            !/run\.app$/i.test(host)
          ) {
            handleUnbuiltStaticHost();
          }
        }, 1000);
      })();
    </script>
